<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff8f00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5e00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#121212" stroke="#2c2c2e" stroke-width="8" />
  <circle cx="256" cy="256" r="160" stroke="url(#grad)" stroke-width="24" fill="none" stroke-linecap="round" stroke-dasharray="750 300" transform="rotate(-90 256 256)" filter="url(#glow)" />
  <path d="M200 260 L240 300 L320 190" stroke="#00e676" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="6">MYJOURNEY</text>
</svg>
